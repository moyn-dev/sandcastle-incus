# What a kitchen-setup box needs to run this repo's e2e (docs/e2e-sc2.md): Incus inside the box, and the
# credentials of .env.e2e.sample. Names only; the values come from the launcher's side, never from this repo.
# Format: https://github.com/moyn-dev/kitchen-setup (box/kitchen.py).

[features]
nesting = "required"   # Incus runs inside the box: system containers need security.nesting
kvm = "optional"       # the VM phases; container-only without it

[setup]
apt = ["gnupg", "jq", "acl"]
run = "scripts/kitchen-setup.sh"

[env]
file = ".env.sc2"      # what scripts/e2e.sh sources; .gitignore ignores it (.env.*)

[secrets.TAILSCALE_AUTH_KEY]
description = "REUSABLE, pre-authorized Tailscale auth key allowed to carry tag:sandcastle; the e2e client and the tenant sidecar both join with it"
required = true

[secrets.SANDCASTLE_E2E_CLOUDFLARE_TOKEN]
description = "Cloudflare API token, Zone:Read + DNS:Edit on the e2e zone only; Phase 12 (pdz) is skipped without it"
required = false

[secrets.SANDCASTLE_E2E_PUBLIC_DNS_ZONE]
description = "the Cloudflare zone Phase 12 creates its records under; Phase 12 is skipped without it"
required = false
