# What a kitchen-setup box needs to run this repo's e2e (docs/e2e-sc2.md): Incus inside the box, and the
# credentials of .env.e2e.sample. Names only; the values come from the vault kitchen-setup reads, never from this repo.
# Format: https://github.com/moyn-dev/kitchen-setup (box/kitchen.py, docs/secrets.md). The name is kitchen-setup.toml
# since moyn-dev/kitchen-setup#50; [env] and [setup] run of #47 are refused there.

[features]
nesting = "required"   # Incus runs inside the box: system containers need security.nesting
kvm = "optional"       # the VM phases; container-only without it

[setup]                # then the box runs `mise run setup`: scripts/kitchen-setup.sh
apt = ["gnupg", "jq", "acl"]
# The vault's secrets land in ~/.kitchen-setup/env, outside the clone; scripts/e2e.sh reads it when .env.sc2 is absent.

[secrets.TAILSCALE_AUTH_KEY]
description = "REUSABLE, pre-authorized Tailscale auth key allowed to carry tag:sandcastle; the e2e client and the tenant sidecar both join with it. Every live e2e phase needs it; a box for other work does not"
required = false       # a required secret that is not granted stops every launch of this repo (kitchen-setup#49)

[secrets.SANDCASTLE_E2E_CLOUDFLARE_TOKEN]
description = "Cloudflare API token, Zone:Read + DNS:Edit on the e2e zone only; Phase 12 (pdz) is skipped without it"
required = false

[secrets.SANDCASTLE_E2E_PUBLIC_DNS_ZONE]
description = "the Cloudflare zone Phase 12 creates its records under; Phase 12 is skipped without it"
required = false
